name: Build OMNIA MouseFix

on:
  push:
    branches: [ "omnia-mousefix" ]
    paths:
      - "src/mousefix/**"
      - "docs/MOUSEFIX.md"
      - ".github/workflows/build-mousefix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Get MinHook
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.3.4 https://github.com/TsudaKageyu/minhook.git "$env:RUNNER_TEMP\minhook"
          if ($LASTEXITCODE -ne 0) { throw "MinHook download failed." }

      - name: Build MinHook
        shell: pwsh
        run: |
          cmake -S "$env:RUNNER_TEMP\minhook" -B "$env:RUNNER_TEMP\minhook-build" -A Win32 -DMH_BUILD_SHARED=OFF -DMH_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { throw "MinHook configure failed." }
          cmake --build "$env:RUNNER_TEMP\minhook-build" --config Release
          if ($LASTEXITCODE -ne 0) { throw "MinHook build failed." }
          $lib = Get-ChildItem "$env:RUNNER_TEMP\minhook-build" -Filter "libMinHook.x86.lib" -Recurse | Select-Object -First 1
          if (-not $lib) { $lib = Get-ChildItem "$env:RUNNER_TEMP\minhook-build" -Filter "*.lib" -Recurse | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1 }
          if (-not $lib) { throw "MinHook static library not found." }
          "MINHOOK_LIB=$($lib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MINHOOK_INCLUDE=$env:RUNNER_TEMP\minhook\include" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build 32-bit ASI plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\OMNIA-MouseFix" | Out-Null
          cl.exe /nologo /LD /O2 /EHsc /std:c++17 /DWIN32_LEAN_AND_MEAN /I"$env:MINHOOK_INCLUDE" "src\mousefix\OMNIA_MouseFix.cpp" "$env:MINHOOK_LIB" /link /MACHINE:X86 dinput8.lib dxguid.lib /OUT:"dist\OMNIA-MouseFix\OMNIA_MouseFix.asi"
          if ($LASTEXITCODE -ne 0) { throw "MouseFix compilation failed." }

      - name: Verification 1 - validate x86 PE binary
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("dist\OMNIA-MouseFix\OMNIA_MouseFix.asi")
          if ($bytes.Length -lt 256) { throw "ASI binary is unexpectedly small." }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "Missing MZ header." }
          $offset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($bytes[$offset] -ne 0x50 -or $bytes[$offset + 1] -ne 0x45) { throw "Missing PE signature." }
          if ([BitConverter]::ToUInt16($bytes, $offset + 4) -ne 0x014C) { throw "Not an x86 plugin." }
          Write-Host "x86 PE verification passed."

      - name: Stage package
        shell: pwsh
        run: |
          Copy-Item "docs\MOUSEFIX.md" "dist\OMNIA-MouseFix\INSTALLATION.txt"
          Compress-Archive -Path "dist\OMNIA-MouseFix\*" -DestinationPath "dist\OMNIA-MouseFix.zip" -Force

      - name: Verification 2 - inspect ZIP
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path "dist\OMNIA-MouseFix.zip"))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            if ($names -notcontains "OMNIA_MouseFix.asi") { throw "ASI missing from ZIP." }
            if ($names -notcontains "INSTALLATION.txt") { throw "Installation notes missing." }
            Write-Host "ZIP verification passed."
          } finally { $zip.Dispose() }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMNIA-MouseFix-x86
          path: dist/OMNIA-MouseFix.zip
          if-no-files-found: error
          retention-days: 14
